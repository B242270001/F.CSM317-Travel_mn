name: travel_mn

description: 'goy'

publish_to: 'none'

version: 1.0.0+1

environment: 
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  go_router: ^18.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ # buhel havtas aar

  fonts:
    - family: RobotoSlab
      fonts:
        - asset: assets/fonts/RobotoSlab-Regular.ttf
        - asset: assets/fonts/RobotoSlab-Bold.ttf
          weight: 700
